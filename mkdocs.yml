site_name: Manawatu Jazz Club Big Swing Band
site_description: Levin RSA Cabaret on Saturday 31 October 2026 at 7:30 pm.
site_url: !ENV [SITE_URL, "https://manawatujazzclubbigswing.band/"]

exclude_docs: |
  gigs.md
  repertoire.md
  blog/

theme:
  name: material
  custom_dir: overrides
  logo: assets/saxophone.svg
  favicon: assets/saxophone.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - About: about.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - tables
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/about-directions.js
