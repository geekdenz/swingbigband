site_name: SwingBig.Band
site_description: News, gigs, repertoire, and notes from a swing big band.

theme:
  name: material
  logo: assets/saxophone.svg
  favicon: assets/saxophone.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Gigs: gigs.md
  - Repertoire: repertoire.md
  - About: about.md
  - Blog:
      - blog/index.md

plugins:
  - search
  - blog

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/music
      link: /repertoire/
      name: Repertoire
    - icon: fontawesome/solid/calendar-days
      link: /gigs/
      name: Gigs
